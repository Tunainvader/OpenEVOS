name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests
      # audit APP-20: new type errors fail; the recorded ones are in mypy-baseline.txt (one job is enough)
      - if: matrix.os == 'windows-latest' && matrix.python == '3.12'
        run: python tools/mypy_baseline.py
      # Default suite: fully mocked, no hardware. On windows-latest the opt-in live query smoke tests also run.
      - run: python -m pytest -m "not hardware"
        env:
          QT_QPA_PLATFORM: offscreen
